<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KINETIC XI — Playable Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="view" tabindex="0" aria-label="KINETIC XI match view"></canvas>
  <a href="../game3d/index.html" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9;background:#ffe14d;color:#111;font:700 15px -apple-system,Helvetica,Arial,sans-serif;padding:10px 18px;border-radius:10px;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.4)">This is the old 2D prototype — click here to play the new 3D game ▶</a>

  <div id="overlay" role="dialog" aria-label="Settings">
    <div class="panel">
      <header>
        <h1>KINETIC XI <span>· Settings</span></h1>
        <button id="resume">Resume match (Esc)</button>
      </header>
      <div id="menu"></div>
    </div>
  </div>

  <noscript>KINETIC XI needs JavaScript enabled.</noscript>

  <!-- Plain scripts (no modules) so the page also works when opened straight from Finder. -->
  <script src="js/core.js"></script>
  <script src="js/surface.js"></script>
  <script src="js/ball.js"></script>
  <script src="js/input.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/player.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
