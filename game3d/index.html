<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KINETIC XI — 3D Football</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage"></div>

  <!-- Loading / error -->
  <div id="loading">
    <div class="load-brand">KINETIC <b>XI</b></div>
    <div class="load-bar"><i></i></div>
    <div class="load-text" id="load-text">Loading the 3D engine (Three.js r160)…</div>
  </div>

  <!-- In-match HUD -->
  <div id="hud" class="hidden">
    <div id="scorebug">
      <div class="sb-team"><i class="kit" id="sb-kit-h"></i><span id="sb-code-h">HOM</span></div>
      <div class="sb-score"><span id="sb-h">0</span><em>–</em><span id="sb-a">0</span></div>
      <div class="sb-team"><span id="sb-code-a">AWY</span><i class="kit" id="sb-kit-a"></i></div>
      <div class="sb-clock"><span id="sb-clock">00:00</span><small id="sb-half">1H</small></div>
    </div>
    <div id="toasts"></div>
    <div id="action"></div>
    <div id="radar-wrap"><canvas id="radar" width="320" height="207"></canvas></div>
    <div id="panel" class="hidden"></div>
  </div>

  <!-- Always-on performance counter -->
  <div id="fps"><b id="fps-v">--</b> FPS<span id="fps-ms">-- ms</span><span id="fps-t">target --</span></div>

  <!-- Main / pause menu -->
  <div id="menu" class="open">
    <div class="menu-shell">
      <header class="brand">
        <div class="logo">KINETIC <b>XI</b></div>
        <div class="tagline" id="menu-tagline">Matchday · Physics-first football</div>
      </header>
      <nav class="tabs" id="tabs">
        <button data-tab="kickoff" class="active">KICK OFF</button>
        <button data-tab="settings">GAME SETTINGS</button>
        <button data-tab="controls">CONTROLS</button>
      </nav>
      <section class="tab-body" id="tab-body"></section>
      <footer class="menu-foot" id="menu-foot">Esc · resume / pause &nbsp;·&nbsp; Settings apply live</footer>
    </div>
  </div>

  <noscript>KINETIC XI needs JavaScript enabled.</noscript>

  <!-- Game modules (plain scripts: they also work when index.html is opened from Finder). -->
  <script src="js/sim/core.js"></script>
  <script src="js/sim/surface.js"></script>
  <script src="js/sim/ball.js"></script>
  <script src="js/sim/player.js"></script>
  <script src="js/sim/ai.js"></script>
  <script src="js/sim/audio.js"></script>
  <script src="js/sim/settings.js"></script>
  <script src="js/sim/input.js"></script>
  <script src="js/sim/match.js"></script>
  <script src="js/gfx/engine.js"></script>
  <script src="js/gfx/environment.js"></script>
  <script src="js/gfx/stadium.js"></script>
  <script src="js/gfx/pitch.js"></script>
  <script src="js/gfx/goals.js"></script>
  <script src="js/gfx/humanoid.js"></script>
  <script src="js/gfx/ball3d.js"></script>
  <script src="js/gfx/weather.js"></script>
  <script src="js/gfx/markers.js"></script>
  <script src="js/gfx/camera.js"></script>
  <script src="js/ui/hud.js"></script>
  <script src="js/ui/menu.js"></script>
  <script src="js/main.js"></script>

  <!-- Three.js r160 from the jsDelivr CDN (exact version pinned). -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    try {
      const THREE = await import('three');
      const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { ShaderPass }, { OutputPass }, { FXAAShader }, { Sky }] = await Promise.all([
        import('three/addons/postprocessing/EffectComposer.js'),
        import('three/addons/postprocessing/RenderPass.js'),
        import('three/addons/postprocessing/UnrealBloomPass.js'),
        import('three/addons/postprocessing/ShaderPass.js'),
        import('three/addons/postprocessing/OutputPass.js'),
        import('three/addons/shaders/FXAAShader.js'),
        import('three/addons/objects/Sky.js'),
      ]);
      window.KXI.THREE = Object.assign({}, THREE, { EffectComposer, RenderPass, UnrealBloomPass, ShaderPass, OutputPass, FXAAShader, Sky });
      window.KXI.boot();
    } catch (err) {
      window.KXI.bootError(err);
    }
  </script>
</body>
</html>
