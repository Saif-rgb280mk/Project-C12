<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <!-- This line connects the CSS file to this HTML file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top bar with the menu -->
    <header>
        <h1>My First Website</h1>
        <nav>
            <a href="#about">About</a>
            <a href="#hobbies">Hobbies</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <!-- Section 1 -->
        <section id="about" class="card">
            <h2>About Me</h2>
            <p>Hi! I am a student learning <strong>HTML</strong> and <em>CSS</em>.</p>
            <img src="https://picsum.photos/400/200" alt="A random picture">
        </section>

        <!-- Section 2 -->
        <section id="hobbies" class="card">
            <h2>My Hobbies</h2>
            <ul>
                <li>Gaming</li>
                <li>Football</li>
                <li>Coding</li>
            </ul>
        </section>

        <!-- Section 3 -->
        <section id="contact" class="card">
            <h2>Contact</h2>
            <p>Click the button below:</p>
            <button>Say Hello</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

</body>
</html>
